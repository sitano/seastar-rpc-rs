[package]
name = "seastar-rpc"
version = "0.2.1-rc.2"
edition = "2024"
rust-version = "1.85"
description = "Seastar RPC async Rust server/client"
repository = "https://github.com/sitano/seastar-rpc-rs"
documentation = "https://docs.rs/seastar-rpc"
keywords = ["seastar", "scylla", "rpc"]
categories = ["asynchronous", "network-programming", "database"]
license = "MIT OR Apache-2.0"
exclude = [".github/", "Makefile", "docs/*_P[0-9]_*.md", "AGENTS.md", "CLAUDE.md", ".claude/", ".gitmessage"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode"] }
thiserror = "2"
tokio = { version = "1.38", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
dhat = "0.3"
criterion = { version = "0.8", features = ["async_tokio"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", default-features = false, features = ["serde", "std"] }

[[bench]]
name = "call"
harness = false

[[bench]]
name = "stream"
harness = false

[lints.rust]
# Heap profiling for examples: RUSTFLAGS="--cfg dhat_heap" cargo run --example client
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dhat_heap)"] }

[lints.cargo]
# `cargo package` normalizes the manifest with an explicit `readme`, which
# then trips this lint during verification.
manual_readme = "allow"
